# Render Blueprint for HackFlow (Django + PostgreSQL)
# Docs: https://docs.render.com/blueprint-spec
databases:
  - name: hackflow-postgres
    databaseName: hackflow
    user: hackflow
    plan: free
    region: oregon

services:
  - type: web
    name: hackflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: hackflow-postgres
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DB_CONN_HEALTH_CHECKS
        value: "True"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"

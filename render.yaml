# Render Blueprint for HackFlow (Django + MySQL as private service)
# Docs: https://docs.render.com/blueprint-spec
services:
  - type: web
    name: hackflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "*"
      - key: MYSQL_DATABASE
        fromService:
          name: hackflow-mysql
          type: pserv
          envVarKey: MYSQL_DATABASE
      - key: MYSQL_USER
        fromService:
          name: hackflow-mysql
          type: pserv
          envVarKey: MYSQL_USER
      - key: MYSQL_PASSWORD
        fromService:
          name: hackflow-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: MYSQL_HOST
        fromService:
          name: hackflow-mysql
          type: pserv
          property: host
      - key: MYSQL_PORT
        fromService:
          name: hackflow-mysql
          type: pserv
          property: port
      - key: DB_CONN_MAX_AGE
        value: "60"

  - type: pserv
    name: hackflow-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.0
    plan: free
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10
    envVars:
      - key: MYSQL_DATABASE
        value: hackflow
      - key: MYSQL_USER
        value: hackflow
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
      - key: PORT
        value: "3306"

# Render Blueprint for HackFlow (Django + PostgreSQL + Key Value)
# Docs: https://render.com/docs/blueprint-spec
databases:
  - name: hackflow-postgres
    databaseName: hackflow
    user: hackflow
    plan: free
    region: oregon
    # Free Render Postgres databases expire 30 days after creation. Upgrade
    # the plan for anything long-lived.

envVarGroups:
  # Used by the web service (and by a dedicated worker if you add one on a
  # paid plan) so sessions and tokens share one signing key. Do not use
  # generateValue per service.
  - name: hackflow-shared
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: TIME_ZONE
        value: "Africa/Tunis"
      - key: AI_MODEL
        # Groq-hosted model id; every AI service reads this through core.groq.
        value: "openai/gpt-oss-120b"

services:
  - type: web
    name: hackflow
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health/
    # The free plan has no background-worker tier, so this starts Gunicorn and
    # one solo Celery worker in the same 512 MB web instance.
    dockerCommand: sh /app/scripts/start-render.sh
    # Free web services have an ephemeral filesystem: sponsor logos uploaded
    # at runtime are lost on redeploy/restart. Use object storage or a paid
    # plan with a persistent disk for durable media.
    envVars:
      - fromGroup: hackflow-shared
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: SECURE_HSTS_SECONDS
        value: "31536000"
      - key: SECURE_HSTS_INCLUDE_SUBDOMAINS
        value: "True"
      - key: SECURE_HSTS_PRELOAD
        value: "True"
      - key: DATABASE_URL
        fromDatabase:
          name: hackflow-postgres
          property: connectionString
      - key: DB_CONN_MAX_AGE
        value: "60"
      - key: DB_CONN_HEALTH_CHECKS
        value: "True"
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: REDIS_URL
        fromService:
          name: hackflow-redis
          type: keyvalue
          property: connectionString
      # Celery/Redis async AI. The co-located worker consumes the long Groq
      # calls so HTTP requests are never blocked.
      - key: AI_ASYNC_ENABLED
        value: "True"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "False"
      - key: CELERY_TASK_TIME_LIMIT
        value: "60"
      # Sized for the free 512 MB / 0.1 CPU instance.
      - key: GUNICORN_WORKERS
        value: "1"
      - key: GUNICORN_THREADS
        value: "4"
      # No Nginx/object storage on the free plan: let Django serve /media/.
      - key: SERVE_MEDIA
        value: "True"
      # Demo data: profile roles drive sponsor permissions, and the idempotent
      # seeder runs after migrate/collectstatic in the web container. This
      # project is a demo, so production seeding stays on by default.
      # All demo users share password: hackflow2026
      - key: SPONSORS_USE_PROFILE_ROLE
        value: "True"
      - key: SEED_DEMO_DATA
        value: "True"
      - key: PASSWORD_RESET_TIMEOUT
        value: "259200"
      - key: LOGIN_MAX_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_SECONDS
        value: "900"
      - key: EMAIL_VERIFICATION_RESEND_COOLDOWN
        value: "60"
      - key: AI_RATE_LIMIT_MAX
        value: "20"
      - key: AI_RATE_LIMIT_WINDOW
        value: "60"
      # RENDER_EXTERNAL_HOSTNAME / RENDER_EXTERNAL_URL are added to
      # ALLOWED_HOSTS and CSRF_TRUSTED_ORIGINS automatically. Add custom
      # domains via DJANGO_ALLOWED_HOSTS / DJANGO_CSRF_TRUSTED_ORIGINS.

  # Render has no free background-worker plan. The Celery worker therefore
  # runs inside the free web service (see scripts/start-render.sh). On a paid
  # plan, move it to a `type: worker` service and remove the worker startup
  # from that script.

  - type: keyvalue
    name: hackflow-redis
    plan: free
    region: oregon
    # Empty allow list = private network only (the web service reaches it
    # internally).
    ipAllowList: []
    # This instance is both the shared cache and the Celery broker. Never
    # evict keys: dropping a queued job would silently lose an AI evaluation.
    maxmemoryPolicy: noeviction

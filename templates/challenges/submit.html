{% extends "base.html" %}
{% block title %}Submit Solution — {{ challenge.title }}{% endblock %}
{% block content %}
<div class="container-page max-w-3xl py-10 space-y-4">
    <a href="{% url 'challenges:detail' challenge.slug %}" class="inline-flex items-center gap-1.5 text-xs font-medium text-muted-foreground hover:text-foreground">
        <c-lucideicon.arrow-left class="size-3.5" /> Back
    </a>
    <h1 class="text-2xl font-bold">Submit solution: {{ challenge.title }}</h1>
    <c-card class="border-border/70 bg-card/50 p-6">
        <form method="post" class="space-y-3">
            {% csrf_token %}
            {{ form.solution }}
            {% for error in form.solution.errors %}<p class="text-xs text-destructive">{{ error }}</p>{% endfor %}
            <c-button type="submit" size="sm">Submit</c-button>
        </form>
    </c-card>
</div>
{% endblock %}

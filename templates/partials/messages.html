{% for message in messages %}
<div class="mb-2 flex items-start gap-3 rounded-lg border px-4 py-3 text-sm shadow-sm
    {% if message.level_tag == 'error' %}border-destructive/40 bg-destructive/10 text-destructive
    {% elif message.level_tag == 'warning' %}border-amber-600/30 bg-amber-500/10 text-amber-800 dark:border-amber-500/30 dark:text-amber-200
    {% elif message.level_tag == 'success' %}border-primary/30 bg-primary/10 text-foreground
    {% else %}border-border bg-card text-foreground{% endif %}">
    <span class="mt-0.5 shrink-0
        {% if message.level_tag == 'success' %}text-primary
        {% elif message.level_tag == 'warning' %}text-amber-600 dark:text-amber-300
        {% elif message.level_tag == 'error' %}text-destructive
        {% else %}text-muted-foreground{% endif %}">
        {% if message.level_tag == 'success' %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <path d="m9 11 3 3L22 4"/>
        </svg>
        {% elif message.level_tag == 'warning' %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
            <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
            <path d="M12 9v4"/>
            <path d="M12 17h.01"/>
        </svg>
        {% elif message.level_tag == 'error' %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4"/>
            <path d="M12 16h.01"/>
        </svg>
        {% else %}
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="size-4" aria-hidden="true">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 16v-4"/>
            <path d="M12 8h.01"/>
        </svg>
        {% endif %}
    </span>
    <p class="leading-relaxed">{{ message }}</p>
</div>
{% endfor %}

{% extends "base.html" %}

{% block title %}404 — Page Not Found — HackFlow{% endblock %}

{% block content %}
<section class="min-h-[70vh] flex items-center justify-center px-4 py-16 sm:px-6 lg:px-8">
    <div class="max-w-md w-full text-center space-y-6">
        <div class="relative mx-auto flex h-24 w-24 items-center justify-center rounded-2xl border border-border bg-card/60 shadow-lg backdrop-blur">
            <span class="text-4xl">🧭</span>
            <span class="absolute -top-2 -right-2 inline-flex items-center rounded-full bg-destructive/10 border border-destructive/20 px-2 py-0.5 text-[11px] font-semibold text-destructive">
                404
            </span>
        </div>

        <div class="space-y-2">
            <h1 class="text-3xl font-extrabold tracking-tight text-foreground sm:text-4xl">
                Page Not Found
            </h1>
            <p class="text-sm text-muted-foreground">
                The page you're looking for might have been removed, had its name changed, or is temporarily unavailable.
            </p>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
            <a href="{% url 'core:home' %}" class="w-full sm:w-auto inline-flex items-center justify-center rounded-lg bg-primary px-5 py-2.5 text-xs font-semibold text-primary-foreground shadow-sm hover:bg-primary/90 transition-colors">
                Back to Home
            </a>
            <a href="{% url 'projects:project_list' %}" class="w-full sm:w-auto inline-flex items-center justify-center rounded-lg border border-border bg-background px-5 py-2.5 text-xs font-semibold text-foreground hover:bg-accent transition-colors">
                Explore Projects
            </a>
        </div>
    </div>
</section>
{% endblock %}

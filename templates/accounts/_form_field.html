<div class="space-y-2">
    <div class="flex items-center justify-between gap-3">
        <label
            for="{{ field.id_for_label }}"
            class="text-sm font-medium leading-none {% if field.errors %}text-destructive{% endif %}"
        >
            {{ field.label }}
        </label>
        {% if field.field.required %}
        <span class="font-mono text-[10px] uppercase tracking-[0.14em] text-muted-foreground">required</span>
        {% endif %}
    </div>

    {% if field.field.choices %}
    <select
        name="{{ field.html_name }}"
        id="{{ field.id_for_label }}"
        {% if field.field.required %}required{% endif %}
        {% if field.errors %}aria-invalid="true"{% endif %}
        class="flex h-9 w-full rounded-md border border-input bg-card text-foreground px-3 py-1 text-sm shadow-xs transition-colors focus-visible:outline-hidden focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm {% if field.errors %}border-destructive focus-visible:ring-destructive{% endif %}"
    >
        {% for choice in field.field.choices %}
        <option value="{{ choice.0 }}" class="bg-card text-foreground" {% if field.value == choice.0 or field.initial == choice.0 %}selected{% endif %}>
            {{ choice.1 }}
        </option>
        {% endfor %}
    </select>
    {% else %}
    <input
        type="{{ field.field.widget.input_type|default:'text' }}"
        name="{{ field.html_name }}"
        id="{{ field.id_for_label }}"
        {% if field.field.widget.input_type != 'password' %}value="{{ field.value|default_if_none:'' }}"{% endif %}
        {% if field.field.widget.attrs.placeholder %}placeholder="{{ field.field.widget.attrs.placeholder }}"{% endif %}
        {% if field.field.widget.attrs.autocomplete %}autocomplete="{{ field.field.widget.attrs.autocomplete }}"{% endif %}
        {% if field.field.widget.attrs.autofocus %}autofocus{% endif %}
        {% if field.field.required %}required{% endif %}
        {% if field.errors %}aria-invalid="true"{% endif %}
        class="flex h-9 w-full rounded-md border border-input bg-transparent px-3 py-1 text-sm shadow-xs transition-colors file:border-0 file:bg-transparent file:text-sm file:font-medium placeholder:text-muted-foreground focus-visible:outline-hidden focus-visible:ring-1 focus-visible:ring-ring disabled:cursor-not-allowed disabled:opacity-50 md:text-sm {% if field.errors %}border-destructive focus-visible:ring-destructive{% endif %}"
    >
    {% endif %}

    {% if field.help_text %}
    <div class="text-xs leading-relaxed text-muted-foreground [&_ul]:list-disc [&_ul]:space-y-0.5 [&_ul]:pl-4">
        {{ field.help_text }}
    </div>
    {% endif %}

    {% for error in field.errors %}
    <p class="text-xs font-medium text-destructive">{{ error }}</p>
    {% endfor %}
</div>

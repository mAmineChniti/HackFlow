{% extends "accounts/_auth_base.html" %}

{% block title %}Password updated — HackFlow{% endblock %}

{% block auth_card %}
<c-card class="border-border/70 bg-card/80 shadow-2xl backdrop-blur">
    <c-card.header class="items-center text-center">
        <span class="mb-2 flex size-12 items-center justify-center rounded-full border border-primary/25 bg-primary/10 text-primary">
            <c-lucideicon.check class="size-5" />
        </span>
        <c-card.title class="text-xl">Password updated</c-card.title>
        <c-card.description>
            Your password has been changed. You can now sign in with your new
            credentials.
        </c-card.description>
    </c-card.header>

    <c-card.content>
        <c-button_link href="{% url 'accounts:login' %}" size="lg" class="w-full">
            Sign in
            <c-lucideicon.arrow-right />
        </c-button_link>
    </c-card.content>

    <c-card.footer class="flex-col items-stretch pt-0">
        <c-separator class="mb-5" />
        <p class="text-center text-sm text-muted-foreground">
            <a href="{% url 'core:home' %}" class="font-medium text-primary hover:underline">Back to HackFlow</a>
        </p>
    </c-card.footer>
</c-card>
{% endblock %}

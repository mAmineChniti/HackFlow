{% extends "base.html" %}

{% block title %}Confirm deletion — HackFlow{% endblock %}

{% block content %}
<div class="container-page py-12 lg:py-20">
    <div class="mx-auto max-w-lg">
        <div class="rounded-2xl border border-rose-500/30 bg-card p-6 sm:p-8 shadow-lg shadow-rose-500/5 text-center">
            <div class="mx-auto flex size-14 items-center justify-center rounded-full bg-rose-500/15 text-rose-400">
                <svg class="size-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            </div>

            <h1 class="mt-4 text-xl font-bold text-foreground">
                Confirm deletion
            </h1>

            <p class="mt-2 text-sm text-muted-foreground leading-relaxed">
                Are you sure you want to permanently delete <strong class="text-foreground">“{{ object }}”</strong>?
                This action cannot be undone and will also delete the associated history.
            </p>

            <form method="post" class="mt-8 flex items-center justify-center gap-3">
                {% csrf_token %}
                <a href="{% url 'sponsors:dashboard' %}"
                   class="rounded-lg border border-border bg-card px-4 py-2 text-xs font-semibold text-foreground hover:bg-accent transition-colors">
                    Cancel
                </a>
                <button type="submit"
                        class="rounded-lg bg-rose-600 px-5 py-2 text-xs font-semibold text-white hover:bg-rose-700 transition-colors shadow-sm shadow-rose-600/30">
                    Yes, permanently delete
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # Codecov uses GitHub OIDC for tokenless uploads from this public repo.
  id-token: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE: HackFlow.settings
  DJANGO_SECRET_KEY: ci-only-secret-key-change-me
  DJANGO_DEBUG: "True"

jobs:
  checks:
    name: Django checks & lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Django system checks
        run: python manage.py check

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Ruff (syntax + undefined names)
        run: ruff check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hackflow
          POSTGRES_USER: hackflow
          POSTGRES_PASSWORD: hackflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U hackflow -d hackflow"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      # Exercise the same database engine used in production. Do not set
      # REDIS_URL here: the async tests assert the sync fallback when no
      # broker is configured.
      DATABASE_URL: postgresql://hackflow:hackflow@localhost:5432/hackflow
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Run tests with coverage
        run: |
          python -m pytest \
            --cov \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage to Codecov
        if: always() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          flags: unittests
          name: hackflow
          use_oidc: true
          fail_ci_if_error: false
          verbose: true

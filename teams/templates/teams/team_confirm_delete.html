{% extends "base.html" %}
{% block title %}Supprimer l'équipe — HackFlow{% endblock %}

{% block content %}
<section class="container-page py-10" aria-labelledby="delete-title">
    <h1 id="delete-title" class="text-2xl font-semibold">Supprimer « {{ object.name }} » ?</h1>
    <p class="mt-2 text-sm text-muted-foreground">Cette action est définitive : tous les membres seront retirés.</p>
    <form method="post" class="mt-6 flex gap-3">
        {% csrf_token %}
        <c-button type="submit" variant="destructive">Oui, supprimer</c-button>
        <a href="{% url 'teams:detail' object.pk %}" class="inline-flex h-9 items-center rounded-md border border-input px-4 text-sm font-medium hover:bg-accent">Non, annuler</a>
    </form>
</section>
{% endblock %}

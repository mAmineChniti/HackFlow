services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackflow}
      POSTGRES_USER: ${POSTGRES_USER:-hackflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host port 5433 avoids clashing with a local PostgreSQL on 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "${WEB_HOST_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,[::1]"
      POSTGRES_DB: ${POSTGRES_DB:-hackflow}
      POSTGRES_USER: ${POSTGRES_USER:-hackflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackflow}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
